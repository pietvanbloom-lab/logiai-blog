<!-- LogiAI editorial visual · line (forecast accuracy) · bilingual via :lang() -->
<style>
@import url("https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lora:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;700&family=Source+Code+Pro:wght@400;700&display=swap");
.lv-line{--ink:#1a1a1a;--meta:#757575;--hair:#e2e8f0;--accent:#057dbc;background:#fff;color:var(--ink);font-family:"Lora",Georgia,serif;border-top:2px solid #000;border-bottom:2px solid #000;padding:20px 0 22px;box-sizing:border-box;width:100%;max-width:100%}
.lv-line *,.lv-line *::before,.lv-line *::after{box-sizing:border-box}
.lv-line .k{font-family:"Source Code Pro",monospace;font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:10px;margin-bottom:8px}
.lv-line .k .num{color:var(--ink);border:1px solid #000;padding:2px 6px;font-size:10px}
.lv-line h3{font-family:"Playfair Display",serif;font-size:26px;font-weight:400;line-height:1.12;letter-spacing:-.2px;margin:0 0 6px;text-wrap:balance}
.lv-line p.deck{font-family:"Lora",serif;font-size:14px;line-height:1.55;font-style:italic;margin:0 0 16px;max-width:62ch}
.lv-line .leg{display:flex;flex-wrap:wrap;gap:14px 20px;margin-bottom:14px;font-family:"Source Code Pro",monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase}
.lv-line .leg .sw{display:inline-block;width:22px;height:0;border-top:2px solid currentColor;margin-right:6px;vertical-align:middle}
.lv-line svg{width:100%;height:auto;display:block}
.lv-line .foot{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-top:14px;padding-top:10px;border-top:1px solid var(--hair);font-family:"Source Code Pro",monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--meta)}
.lv-line .foot .cap{font-family:"Lora",serif;font-style:italic;font-size:12px;letter-spacing:0;text-transform:none;color:var(--meta);font-weight:700}
.lv-line [data-de],.lv-line [data-en]{display:none}
:lang(de) .lv-line [data-de],:lang(en) .lv-line [data-en]{display:initial}
.lv-line tspan[data-de],.lv-line tspan[data-en]{display:none}
:lang(de) .lv-line tspan[data-de],:lang(en) .lv-line tspan[data-en]{display:initial}
@media (max-width:480px){.lv-line{overflow-x:auto}.lv-line svg{min-width:520px}}
</style>
