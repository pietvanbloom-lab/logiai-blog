<!-- LogiAI editorial visual · hbar (horizontal bar ranking) · bilingual via :lang()
     Paste into a WordPress Custom HTML block. Both DE and EN copy live in
     the markup; the page <html lang="..."> attribute selects which is shown. -->
<style>
@import url("https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lora:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;700&family=Source+Code+Pro:wght@400;700&display=swap");
.lv-hbar{--ink:#1a1a1a;--meta:#757575;--hair:#e2e8f0;--accent:#057dbc;background:#fff;color:var(--ink);font-family:"Lora",Georgia,serif;border-top:2px solid #000;border-bottom:2px solid #000;padding:20px 0 22px;box-sizing:border-box;width:100%;max-width:100%}
.lv-hbar *,.lv-hbar *::before,.lv-hbar *::after{box-sizing:border-box}
.lv-hbar .k{font-family:"Source Code Pro",monospace;font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:10px;margin-bottom:8px}
.lv-hbar .k .num{color:var(--ink);border:1px solid #000;padding:2px 6px;font-size:10px}
.lv-hbar h3{font-family:"Playfair Display",serif;font-size:26px;font-weight:400;line-height:1.12;letter-spacing:-.2px;color:var(--ink);margin:0 0 6px;text-wrap:balance}
.lv-hbar p.deck{font-family:"Lora",serif;font-size:14px;line-height:1.55;font-style:italic;color:var(--ink);margin:0 0 16px;max-width:62ch}
.lv-hbar svg{width:100%;height:auto;display:block}
.lv-hbar .foot{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-top:14px;padding-top:10px;border-top:1px solid var(--hair);font-family:"Source Code Pro",monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--meta)}
.lv-hbar .foot .cap{font-family:"Lora",serif;font-style:italic;font-size:12px;letter-spacing:0;text-transform:none;color:var(--meta);font-weight:700}
.lv-hbar [data-de],.lv-hbar [data-en]{display:none}
:lang(de) .lv-hbar [data-de],:lang(en) .lv-hbar [data-en]{display:initial}
.lv-hbar tspan[data-de],.lv-hbar tspan[data-en]{display:none}
:lang(de) .lv-hbar tspan[data-de],:lang(en) .lv-hbar tspan[data-en]{display:initial}
@media (max-width:480px){.lv-hbar{overflow-x:auto}.lv-hbar svg{min-width:480px}}
</style>
