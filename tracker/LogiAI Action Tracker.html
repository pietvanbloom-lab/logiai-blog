<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LogiAI Action Tracker</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue:    #057dbc;
    --ink:     #1a1a1a;
    --mid:     #555;
    --subtle:  #888;
    --border:  #e2e0db;
    --bg:      #f7f6f4;
    --white:   #ffffff;
    --radius:  6px;

    --bug:      #dc2626;
    --content:  #7c3aed;
    --seo:      #16a34a;
    --tech:     #2563eb;
    --design:   #d97706;

    --open:     #6b7280;
    --inprog:   #d97706;
    --done:     #16a34a;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  .header {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 20px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .logo-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--blue); flex-shrink: 0; }
  .header h1 { font-size: 16px; font-weight: 600; letter-spacing: -0.2px; }
  .header-meta { font-size: 12px; color: var(--subtle); display:flex; align-items:center; gap:10px; }
  .header-meta span { color: var(--ink); font-weight: 500; }
  .sync-badge { font-size: 10.5px; padding: 3px 9px; border-radius: 12px; font-weight: 600; letter-spacing:.3px; }
  .sync-badge.online  { background: #d1fae5; color: #065f46; border:1px solid #a7f3d0; }
  .sync-badge.offline { background: #fef3c7; color: #92400e; border:1px solid #fde68a; cursor:help; }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--white); padding: 10px 18px;
    border-radius: var(--radius); font-size: 12.5px; font-weight: 500;
    box-shadow: 0 6px 20px rgba(0,0,0,.18); z-index: 500;
    opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  .toast.show { opacity: 1; }
  .toast.error { background: #b91c1c; }
  .toast.success { background: #15803d; }

  /* ── TOOLBAR ── */
  .toolbar {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 0;
    overflow-x: auto;
  }
  .filter-group { display: flex; align-items: center; gap: 4px; padding: 10px 0; border-right: 1px solid var(--border); padding-right: 16px; margin-right: 16px; flex-shrink: 0; }
  .filter-group:last-child { border-right: none; }
  .filter-label { font-size: 11px; color: var(--subtle); text-transform: uppercase; letter-spacing: .5px; margin-right: 4px; flex-shrink: 0; }
  .filter-btn {
    font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 20px;
    border: 1px solid transparent; cursor: pointer; background: transparent;
    color: var(--mid); transition: all .15s; white-space: nowrap; flex-shrink: 0;
  }
  .filter-btn:hover { background: var(--bg); }
  .filter-btn.active { background: var(--ink); color: var(--white); border-color: var(--ink); }
  .filter-btn.active.bug    { background: var(--bug);     border-color: var(--bug); }
  .filter-btn.active.content{ background: var(--content); border-color: var(--content); }
  .filter-btn.active.seo    { background: var(--seo);     border-color: var(--seo); }
  .filter-btn.active.tech   { background: var(--tech);    border-color: var(--tech); }
  .filter-btn.active.design { background: var(--design);  border-color: var(--design); }

  /* ── STATS BAR ── */
  .stats {
    display: flex; gap: 24px; padding: 16px 32px;
    border-bottom: 1px solid var(--border);
    background: var(--white);
  }
  .stat { display: flex; align-items: center; gap: 8px; }
  .stat-num { font-size: 22px; font-weight: 700; line-height: 1; color: var(--ink); }
  .stat-lbl { font-size: 11px; color: var(--subtle); text-transform: uppercase; letter-spacing: .4px; }

  /* ── MAIN ── */
  .main { padding: 24px 32px; max-width: 1280px; }

  /* ── TABLE ── */
  .table-wrap { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px;
    color: var(--subtle); padding: 12px 16px; text-align: left;
    background: var(--bg); border-bottom: 1px solid var(--border);
  }
  thead th:first-child { width: 52px; }
  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background .1s;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #fafaf9; }
  tbody tr.done-row { opacity: .55; }
  tbody td { padding: 13px 16px; vertical-align: middle; }
  .td-id { font-size: 11px; color: var(--subtle); font-weight: 600; font-family: monospace; }
  .td-title { font-weight: 500; font-size: 13.5px; line-height: 1.3; max-width: 380px; }
  .td-desc { font-size: 12px; color: var(--mid); line-height: 1.35; margin-top: 3px; }
  .td-source { font-size: 11px; color: var(--subtle); max-width: 180px; }
  .td-date { font-size: 11px; color: var(--subtle); white-space: nowrap; }

  /* ── TYPE BADGE ── */
  .badge {
    display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 20px;
    font-size: 11px; font-weight: 600; letter-spacing: .3px; white-space: nowrap;
  }
  .badge-Bug     { background: #fef2f2; color: var(--bug);     border: 1px solid #fecaca; }
  .badge-Content { background: #f5f3ff; color: var(--content); border: 1px solid #ddd6fe; }
  .badge-SEO     { background: #f0fdf4; color: var(--seo);     border: 1px solid #bbf7d0; }
  .badge-Tech    { background: #eff6ff; color: var(--tech);    border: 1px solid #bfdbfe; }
  .badge-Design  { background: #fffbeb; color: var(--design);  border: 1px solid #fde68a; }

  /* ── STATUS PILL (clickable) ── */
  .status-pill {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;
    cursor: pointer; border: 1.5px solid; transition: opacity .15s; white-space: nowrap;
    user-select: none;
  }
  .status-pill:hover { opacity: .75; }
  .status-pill .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .pill-Open     { color: var(--open);   border-color: #d1d5db; background: #f9fafb; }
  .pill-Open .dot { background: var(--open); }
  .pill-InProgress { color: var(--inprog); border-color: #fde68a; background: #fffbeb; }
  .pill-InProgress .dot { background: var(--inprog); }
  .pill-Done     { color: var(--done);   border-color: #bbf7d0; background: #f0fdf4; }
  .pill-Done .dot { background: var(--done); }

  /* ── PRIORITY DOT ── */
  .prio { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .prio-High   { background: #ef4444; }
  .prio-Medium { background: #f59e0b; }
  .prio-Low    { background: #9ca3af; }

  /* ── EMPTY STATE ── */
  .empty { text-align: center; padding: 48px 16px; color: var(--subtle); }
  .empty strong { display: block; font-size: 15px; color: var(--mid); margin-bottom: 6px; }

  /* ── ADD TASK ── */
  .add-row td { background: #fafaf9; }
  .add-btn {
    background: none; border: 1.5px dashed var(--border); border-radius: var(--radius);
    color: var(--subtle); font-size: 12px; padding: 8px 16px; cursor: pointer;
    width: 100%; text-align: left; transition: all .15s;
  }
  .add-btn:hover { border-color: var(--blue); color: var(--blue); background: #f0f7fd; }

  /* ── ADD FORM ── */
  .add-form { display: none; background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin: 16px 0; }
  .add-form.visible { display: block; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .form-row.full { grid-template-columns: 1fr; }
  .form-group { display: flex; flex-direction: column; gap: 4px; }
  .form-group label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; color: var(--subtle); }
  .form-group input, .form-group select, .form-group textarea {
    border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 10px;
    font-size: 13px; font-family: inherit; color: var(--ink);
    background: var(--white); outline: none; transition: border-color .15s;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--blue); }
  .form-group textarea { resize: vertical; min-height: 72px; }
  .form-actions { display: flex; gap: 8px; }
  .btn-primary {
    background: var(--blue); color: var(--white); border: none;
    border-radius: var(--radius); padding: 8px 18px; font-size: 13px;
    font-weight: 600; cursor: pointer; transition: opacity .15s;
  }
  .btn-primary:hover { opacity: .85; }
  .btn-secondary {
    background: none; border: 1px solid var(--border); color: var(--mid);
    border-radius: var(--radius); padding: 8px 18px; font-size: 13px;
    cursor: pointer; transition: all .15s;
  }
  .btn-secondary:hover { border-color: var(--ink); color: var(--ink); }

  /* ── SCAN INFO ── */
  .scan-info {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px; flex-wrap: wrap; gap: 10px;
  }
  .scan-info-left { font-size: 12px; color: var(--subtle); }
  .scan-info-left strong { color: var(--ink); }
  .count-badge { font-size: 12px; font-weight: 600; color: var(--mid); background: var(--bg); border: 1px solid var(--border); border-radius: 20px; padding: 3px 10px; }

  /* ── DRAWER ── */
  .drawer-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.18); z-index: 200;
  }
  .drawer-overlay.open { display: block; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0;
    width: 440px; max-width: 100vw;
    background: var(--white); border-left: 1px solid var(--border);
    box-shadow: -6px 0 32px rgba(0,0,0,.09);
    z-index: 201; display: flex; flex-direction: column;
    transform: translateX(100%); transition: transform .22s ease;
  }
  .drawer.open { transform: translateX(0); }
  .drawer-header {
    padding: 20px 20px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  }
  .drawer-title { font-size: 14px; font-weight: 600; line-height: 1.35; flex: 1; }
  .drawer-meta { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .drawer-close {
    background: none; border: none; cursor: pointer; color: var(--subtle);
    font-size: 18px; padding: 2px 4px; line-height: 1; flex-shrink: 0;
    transition: color .15s;
  }
  .drawer-close:hover { color: var(--ink); }
  .drawer-body { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .drawer-section-label {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .5px; color: var(--subtle); margin-bottom: 6px;
  }
  .drawer-desc { font-size: 13px; color: var(--mid); line-height: 1.55; }
  .drawer-divider { border: none; border-top: 1px solid var(--border); margin: 0; }
  .prompt-hint { font-size: 11px; color: var(--subtle); margin-bottom: 8px; }
  .prompt-box {
    font-size: 12.5px; font-family: inherit; color: var(--ink);
    background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 12px;
    width: 100%; resize: vertical; min-height: 180px;
    line-height: 1.6; outline: none; transition: border-color .15s;
  }
  .prompt-box:focus { border-color: var(--blue); }
  .drawer-footer { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
  .copy-btn {
    flex: 1; background: var(--blue); color: var(--white); border: none;
    border-radius: var(--radius); padding: 10px 18px;
    font-size: 13px; font-weight: 600; cursor: pointer; transition: background .2s;
  }
  .copy-btn:hover { opacity: .88; }
  .copy-btn.copied { background: var(--done); }
  tbody tr.clickable-row { cursor: pointer; }
  tbody tr.clickable-row:hover { background: #f0f7fd; }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-left">
    <div class="logo-dot"></div>
    <h1>LogiAI Action Tracker</h1>
  </div>
  <div class="header-meta">
    <span class="sync-badge offline" id="sync-badge" title="">Loading...</span>
    Last scan: <span id="last-scan-display"></span>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- TOOLBAR -->
<div class="toolbar">
  <div class="filter-group">
    <span class="filter-label">Type</span>
    <button class="filter-btn active" data-filter-type="all">All</button>
    <button class="filter-btn bug" data-filter-type="Bug">Bug</button>
    <button class="filter-btn content" data-filter-type="Content">Content</button>
    <button class="filter-btn seo" data-filter-type="SEO">SEO</button>
    <button class="filter-btn tech" data-filter-type="Tech">Tech</button>
    <button class="filter-btn design" data-filter-type="Design">Design</button>
  </div>
  <div class="filter-group">
    <span class="filter-label">Status</span>
    <button class="filter-btn active" data-filter-status="all">All</button>
    <button class="filter-btn" data-filter-status="Open">Open</button>
    <button class="filter-btn" data-filter-status="InProgress">In Progress</button>
    <button class="filter-btn" data-filter-status="Done">Done</button>
  </div>
  <div class="filter-group">
    <span class="filter-label">Prio</span>
    <button class="filter-btn active" data-filter-priority="all">All</button>
    <button class="filter-btn" data-filter-priority="High">High</button>
    <button class="filter-btn" data-filter-priority="Medium">Medium</button>
    <button class="filter-btn" data-filter-priority="Low">Low</button>
  </div>
</div>

<!-- STATS -->
<div class="stats">
  <div class="stat">
    <div class="stat-num" id="stat-total">0</div>
    <div class="stat-lbl">Total</div>
  </div>
  <div class="stat">
    <div class="stat-num" id="stat-open" style="color:var(--open)">0</div>
    <div class="stat-lbl">Open</div>
  </div>
  <div class="stat">
    <div class="stat-num" id="stat-inprog" style="color:var(--inprog)">0</div>
    <div class="stat-lbl">In Progress</div>
  </div>
  <div class="stat">
    <div class="stat-num" id="stat-done" style="color:var(--done)">0</div>
    <div class="stat-lbl">Done</div>
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- ADD FORM -->
  <div class="add-form" id="add-form">
    <div class="form-row">
      <div class="form-group">
        <label>Title</label>
        <input type="text" id="f-title" placeholder="Short action title">
      </div>
      <div class="form-group">
        <label>Type</label>
        <select id="f-type">
          <option value="Bug">Bug</option>
          <option value="Content">Content</option>
          <option value="SEO">SEO</option>
          <option value="Tech">Tech</option>
          <option value="Design">Design</option>
        </select>
      </div>
      <div class="form-group">
        <label>Priority</label>
        <select id="f-priority">
          <option value="High">High</option>
          <option value="Medium" selected>Medium</option>
          <option value="Low">Low</option>
        </select>
      </div>
    </div>
    <div class="form-row full">
      <div class="form-group">
        <label>Description</label>
        <textarea id="f-desc" placeholder="What needs to be done and why?"></textarea>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Source / Notes</label>
        <input type="text" id="f-source" placeholder="e.g. Observed on article page">
      </div>
    </div>
    <div class="form-actions">
      <button class="btn-primary" onclick="saveNewTask()">Add Task</button>
      <button class="btn-secondary" onclick="hideForm()">Cancel</button>
    </div>
  </div>

  <!-- SCAN INFO + COUNT -->
  <div class="scan-info">
    <div class="scan-info-left">
      Showing <strong id="visible-count">0</strong> tasks
      <span id="filter-desc"></span>
    </div>
    <button class="btn-secondary" onclick="showForm()" style="font-size:12px;padding:6px 14px;">+ Add task manually</button>
  </div>

  <!-- TABLE -->
  <div class="table-wrap">
    <table id="task-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Title + Description</th>
          <th>Type</th>
          <th>Status</th>
          <th>Prio</th>
          <th>Source</th>
          <th>Added</th>
        </tr>
      </thead>
      <tbody id="task-tbody"></tbody>
    </table>
  </div>

</div><!-- /main -->

<!-- DRAWER OVERLAY -->
<div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>

<!-- DRAWER -->
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <div style="flex:1">
      <div class="drawer-title" id="drawer-title"></div>
      <div class="drawer-meta" id="drawer-meta"></div>
    </div>
    <button class="drawer-close" onclick="closeDrawer()" title="Close">&#x2715;</button>
  </div>
  <div class="drawer-body">
    <div>
      <div class="drawer-section-label">Description</div>
      <div class="drawer-desc" id="drawer-desc"></div>
    </div>
    <hr class="drawer-divider">
    <div>
      <div class="drawer-section-label">Execution prompt</div>
      <p class="prompt-hint">Copy this, paste into chat, and Claude will ask clarifying questions then execute.</p>
      <textarea class="prompt-box" id="drawer-prompt" spellcheck="false"></textarea>
    </div>
  </div>
  <div class="drawer-footer">
    <button class="copy-btn" id="copy-btn" onclick="copyPrompt()">&#x2398; Copy prompt</button>
    <button class="btn-secondary" onclick="closeDrawer()">Close</button>
  </div>
</div>

<script>

// ============================================================

const LS_KEY = "logiai-tracker-v1";
const SERVER_BASE = "http://127.0.0.1:9193";
let SERVER_AVAILABLE = false;
let SERVER_LAST_SCAN = null;
let activeTypeFilter     = "all";
let activeStatusFilter   = "all";
let activePriorityFilter = "all";
let tasks = [];

// ============================================================
// SERVER BRIDGE
// ============================================================
async function probeServer() {
  try {
    const r = await fetch(SERVER_BASE + "/health", { method: "GET", cache: "no-store" });
    return r.ok;
  } catch (e) { return false; }
}

async function fetchServerTasks() {
  const r = await fetch(SERVER_BASE + "/tasks", { cache: "no-store" });
  if (!r.ok) throw new Error("GET /tasks failed: " + r.status);
  return await r.json();
}

async function postStatus(id, status, reason) {
  const r = await fetch(SERVER_BASE + "/tasks/" + encodeURIComponent(id) + "/status", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ status, reason: reason || "", actor: "browser" })
  });
  if (!r.ok) throw new Error("POST status failed: " + r.status + " " + (await r.text()));
  return await r.json();
}

async function postNewTask(task) {
  const r = await fetch(SERVER_BASE + "/tasks", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(task)
  });
  if (!r.ok) throw new Error("POST /tasks failed: " + r.status);
  return await r.json();
}

function updateSyncBadge() {
  const el = document.getElementById("sync-badge");
  if (!el) return;
  if (SERVER_AVAILABLE) {
    el.textContent = "SYNCED";
    el.className = "sync-badge online";
    el.title = "Connected to logiai-tracker server at " + SERVER_BASE + ". Status changes are persisted server-side and audited.";
  } else {
    el.textContent = "OFFLINE";
    el.className = "sync-badge offline";
    el.title = "Server not reachable (" + SERVER_BASE + "). Falling back to embedded data + localStorage. Status changes will not be synced.";
  }
}

function showToast(msg, kind) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast show " + (kind || "");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => { el.className = "toast"; }, 2400);
}

function sortTasks(arr) {
  const prioOrder = { High: 0, Medium: 1, Low: 2 };
  const statOrder = { Open: 0, InProgress: 1, Done: 2 };
  return arr.sort((a, b) => {
    if (statOrder[a.status] !== statOrder[b.status]) return statOrder[a.status] - statOrder[b.status];
    if (prioOrder[a.priority] !== prioOrder[b.priority]) return prioOrder[a.priority] - prioOrder[b.priority];
    return 0;
  });
}

function loadTasksFromEmbedded() {
  // Fallback mode (server unavailable): seed from embedded constant
  // and merge localStorage overrides.
  const base = EMBEDDED_TASKS.map(t => Object.assign({}, t));

  let overrides = {};
  try { overrides = JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch(e) {}

  base.forEach(t => {
    if (overrides[t.id]) {
      Object.assign(t, overrides[t.id]);
      t._manual = true;
    }
  });

  const userKeys = Object.keys(overrides).filter(k => k.startsWith("U"));
  userKeys.forEach(k => {
    if (!base.find(t => t.id === k)) {
      base.push(Object.assign({}, overrides[k]));
    }
  });

  return sortTasks(base);
}

async function loadTasks() {
  if (SERVER_AVAILABLE) {
    try {
      const data = await fetchServerTasks();
      SERVER_LAST_SCAN = data.last_scan || LAST_SCAN;
      return sortTasks((data.tasks || []).map(t => Object.assign({}, t)));
    } catch (e) {
      console.warn("Server fetch failed, falling back:", e);
      SERVER_AVAILABLE = false;
      updateSyncBadge();
    }
  }
  SERVER_LAST_SCAN = LAST_SCAN;
  return loadTasksFromEmbedded();
}

function saveOverride(id, patch) {
  let overrides = {};
  try { overrides = JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch(e) {}
  overrides[id] = Object.assign(overrides[id] || {}, patch);
  localStorage.setItem(LS_KEY, JSON.stringify(overrides));
}

// ============================================================
// RENDER
// ============================================================
const STATUS_CYCLE = { Open: "InProgress", InProgress: "Done", Done: "Open" };
const STATUS_LABEL = { Open: "Open", InProgress: "In Progress", Done: "Done" };

async function cycleStatus(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  const next = STATUS_CYCLE[t.status] || "Open";
  const prev = t.status;

  if (SERVER_AVAILABLE) {
    try {
      const result = await postStatus(id, next, "");
      Object.assign(t, result.task);
      tasks = sortTasks(tasks);
      render();
      showToast("Status -> " + STATUS_LABEL[next] + " (synced)", "success");
    } catch (e) {
      console.error(e);
      showToast("Sync fehlgeschlagen: " + e.message, "error");
      // No optimistic write — keep prev state visible
    }
  } else {
    t.status = next;
    t._manual = true;
    saveOverride(id, { status: next, _manual: true });
    tasks = sortTasks(tasks);
    render();
    showToast("Status -> " + STATUS_LABEL[next] + " (local only, not synced)", "");
  }
}

function render() {
  const tbody = document.getElementById("task-tbody");
  const filtered = tasks.filter(t => {
    const typeOk     = activeTypeFilter     === "all" || t.type === activeTypeFilter;
    const statusOk   = activeStatusFilter   === "all" ||
                       (activeStatusFilter === "InProgress" ? t.status === "InProgress" : t.status === activeStatusFilter);
    const priorityOk = activePriorityFilter === "all" || t.priority === activePriorityFilter;
    return typeOk && statusOk && priorityOk;
  });

  document.getElementById("visible-count").textContent = filtered.length;

  // Stats (always all tasks)
  document.getElementById("stat-total").textContent  = tasks.length;
  document.getElementById("stat-open").textContent   = tasks.filter(t => t.status === "Open").length;
  document.getElementById("stat-inprog").textContent = tasks.filter(t => t.status === "InProgress").length;
  document.getElementById("stat-done").textContent   = tasks.filter(t => t.status === "Done").length;

  // Filter description
  const parts = [];
  if (activeTypeFilter !== "all")     parts.push("type: " + activeTypeFilter);
  if (activeStatusFilter !== "all")   parts.push("status: " + STATUS_LABEL[activeStatusFilter]);
  if (activePriorityFilter !== "all") parts.push("prio: " + activePriorityFilter);
  document.getElementById("filter-desc").textContent = parts.length ? " - " + parts.join(", ") : "";

  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7"><div class="empty"><strong>No tasks match the current filter.</strong>Try clearing filters above.</div></td></tr>';
    return;
  }

  tbody.innerHTML = filtered.map(t => {
    const isDone = t.status === "Done";
    const prioClass = "prio-" + t.priority;
    return `<tr class="${isDone ? "done-row" : ""} clickable-row" onclick="openDrawer('${t.id}')">
      <td class="td-id">${t.id}</td>
      <td>
        <div class="td-title">${esc(t.title)}</div>
        ${t.description ? `<div class="td-desc">${esc(t.description)}</div>` : ""}
      </td>
      <td><span class="badge badge-${t.type}">${t.type}</span></td>
      <td>
        <span class="status-pill pill-${t.status}" onclick="event.stopPropagation(); cycleStatus('${t.id}')" title="Click to advance status">
          <span class="dot"></span>${STATUS_LABEL[t.status]}
        </span>
      </td>
      <td><span class="prio ${prioClass}" title="${t.priority}"></span></td>
      <td class="td-source">${esc(t.source || "")}</td>
      <td class="td-date">${t.date_added || ""}</td>
    </tr>`;
  }).join("");
}

function esc(s) {
  return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// ============================================================
// FILTERS
// ============================================================
document.querySelectorAll("[data-filter-type]").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("[data-filter-type]").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeTypeFilter = btn.dataset.filterType;
    render();
  });
});

document.querySelectorAll("[data-filter-status]").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("[data-filter-status]").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeStatusFilter = btn.dataset.filterStatus;
    render();
  });
});

document.querySelectorAll("[data-filter-priority]").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("[data-filter-priority]").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activePriorityFilter = btn.dataset.filterPriority;
    render();
  });
});

// ============================================================
// ADD TASK FORM
// ============================================================
function showForm() {
  document.getElementById("add-form").classList.add("visible");
  document.getElementById("f-title").focus();
}
function hideForm() {
  document.getElementById("add-form").classList.remove("visible");
  ["f-title","f-desc","f-source"].forEach(id => document.getElementById(id).value = "");
}
async function saveNewTask() {
  const title = document.getElementById("f-title").value.trim();
  if (!title) { alert("Title is required."); return; }
  const id = "U" + Date.now();
  const task = {
    id,
    title,
    type:       document.getElementById("f-type").value,
    priority:   document.getElementById("f-priority").value,
    status:     "Open",
    description: document.getElementById("f-desc").value.trim(),
    source:     document.getElementById("f-source").value.trim() || "Added manually",
    date_added: new Date().toISOString().slice(0,10)
  };

  if (SERVER_AVAILABLE) {
    try {
      await postNewTask(task);
      tasks = await loadTasks();
      hideForm();
      render();
      showToast("Task added (synced)", "success");
      return;
    } catch (e) {
      console.error(e);
      showToast("Add failed: " + e.message, "error");
      return;
    }
  }

  // offline fallback
  task._manual = true;
  saveOverride(id, task);
  tasks = await loadTasks();
  hideForm();
  render();
}

// ============================================================
// PROMPT TEMPLATES
// ============================================================
const PROMPT_INTRO = {
  Bug:     "Fix the following bug on logiai.blog",
  Content: "Work on the following content task for logiai.blog",
  SEO:     "Implement the following SEO improvement for logiai.blog",
  Tech:    "Implement the following technical task for logiai.blog",
  Design:  "Fix the following design issue on logiai.blog"
};

function buildPrompt(t) {
  const intro = PROMPT_INTRO[t.type] || "Work on the following task for logiai.blog";
  return `${intro}:

Task ID: ${t.id}
Title: ${t.title}
Type: ${t.type}  |  Priority: ${t.priority}

Details:
${t.description || "No description provided."}

Source: ${t.source || ""}

Please ask any clarifying questions you need before starting, then implement the task.`;
}

// ============================================================
// DRAWER
// ============================================================
function openDrawer(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;

  document.getElementById("drawer-title").textContent = t.title;
  document.getElementById("drawer-desc").textContent = t.description || "No description.";
  document.getElementById("drawer-prompt").value = buildPrompt(t);

  const meta = document.getElementById("drawer-meta");
  meta.innerHTML =
    `<span class="badge badge-${t.type}">${t.type}</span>` +
    `<span class="status-pill pill-${t.status}" style="pointer-events:none"><span class="dot"></span>${STATUS_LABEL[t.status] || t.status}</span>` +
    `<span class="prio prio-${t.priority}" title="${t.priority} priority" style="display:inline-block"></span>` +
    `<span style="font-size:11px;color:var(--subtle);font-family:monospace">${t.id}</span>`;

  const btn = document.getElementById("copy-btn");
  btn.textContent = "⎘ Copy prompt";
  btn.classList.remove("copied");

  document.getElementById("drawer-overlay").classList.add("open");
  document.getElementById("drawer").classList.add("open");
}

function closeDrawer() {
  document.getElementById("drawer-overlay").classList.remove("open");
  document.getElementById("drawer").classList.remove("open");
}

function copyPrompt() {
  const text = document.getElementById("drawer-prompt").value;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById("copy-btn");
    btn.textContent = "Copied!";
    btn.classList.add("copied");
    setTimeout(() => {
      btn.textContent = "⎘ Copy prompt";
      btn.classList.remove("copied");
    }, 2200);
  }).catch(() => {
    // fallback for browsers that block clipboard
    const ta = document.getElementById("drawer-prompt");
    ta.select();
    document.execCommand("copy");
    const btn = document.getElementById("copy-btn");
    btn.textContent = "Copied!";
    btn.classList.add("copied");
    setTimeout(() => { btn.textContent = "⎘ Copy prompt"; btn.classList.remove("copied"); }, 2200);
  });
}

// esc key closes drawer
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

// ============================================================
// INIT
// ============================================================
async function init() {
  SERVER_AVAILABLE = await probeServer();
  updateSyncBadge();

  tasks = await loadTasks();

  const scanStr = SERVER_LAST_SCAN || LAST_SCAN;
  if (scanStr) {
    document.getElementById("last-scan-display").textContent = new Date(scanStr).toLocaleString("en-GB", {
      day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit"
    });
  }

  render();
}

init();
</script>
